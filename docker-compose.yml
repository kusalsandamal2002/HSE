services:
  postgres:
    image: postgres:16
    container_name: hse_pro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hse_pro
    ports:
      - "5432:5432"
    volumes:
      - hse_pro_pgdata:/var/lib/postgresql/data
volumes:
  hse_pro_pgdata:
